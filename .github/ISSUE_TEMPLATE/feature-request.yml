name: Feature request
description: Describe a task that TodoBench could make easier.
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to accomplish?
      description: Describe your workflow and what currently gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain the result you would like and any alternatives you have tried.
    validations:
      required: true
