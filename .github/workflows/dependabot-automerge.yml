name: Dependabot auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    name: Queue safe Dependabot update
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Read verified Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Queue patch or security update for squash merge
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.dependency-group == 'actions-security-updates' ||
          steps.metadata.outputs.dependency-group == 'pip-security-updates'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          set -euo pipefail
          case "$UPDATE_TYPE" in
            version-update:semver-major)
              echo "Major updates stay manual."
              exit 0
              ;;
          esac
          if [ "${{ steps.metadata.outputs.package-ecosystem }}" = "vcpkg" ]; then
            echo "Native vcpkg baseline updates stay manual."
            exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
