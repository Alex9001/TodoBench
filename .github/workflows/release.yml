name: Release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all verification gates pass
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  stage:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: version
        run: echo "version=$(python3 scripts/version.py)" >> "$GITHUB_OUTPUT"
      - name: Create draft at this commit
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: python3 scripts/stage-release.py "$VERSION" "$GITHUB_SHA"
  package:
    needs: stage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x86_64
          - os: windows-2025
            platform: windows-x64
          - os: macos-15-intel
            platform: macos-x86_64
          - os: macos-14
            platform: macos-arm64
    env:
      VERSION: ${{ needs.stage.outputs.version }}
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-native
      - if: runner.os != 'Windows'
        run: cmake --preset release -DTODOBENCH_BUILD_TESTS=ON
      - if: runner.os == 'Windows'
        shell: pwsh
        run: cmake --preset release -DTODOBENCH_BUILD_TESTS=ON "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
      - run: cmake --build --preset release --parallel 3
      - name: Test release build
        run: ctest --test-dir build/release --output-on-failure --timeout 130
      - name: Render themes at both display scales
        shell: bash
        run: |
          for scale in 1 2; do
            QT_SCALE_FACTOR="$scale" TODOBENCH_THEME_SCREENSHOTS="$PWD/build/screenshots/$scale" build/release/test_main_window themesRender themeSwitchUpdatesExistingWidgets
          done
      - if: runner.os == 'Linux'
        name: Linux packages
        run: |
          scripts/install-linuxdeploy.sh
          export PATH="$PWD/build/tools:$PATH"
          export APPIMAGE_EXTRACT_AND_RUN=1
          scripts/package-linux-appimage.sh "$VERSION" build/release dist
          scripts/package-linux-portable.sh "$VERSION" build/release dist
      - if: runner.os == 'macOS'
        name: macOS packages
        run: scripts/package-macos.sh "$VERSION" build/release dist
      - if: runner.os == 'Windows'
        name: Windows packages
        shell: pwsh
        run: scripts/package-windows.ps1 -Version $env:VERSION
      - name: Verify native packages
        run: python scripts/verify-packages.py dist
      - name: Retain native startup diagnostics
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: startup-diagnostics-${{ matrix.platform }}
          path: build/package-diagnostics/
          if-no-files-found: warn
      - name: Collect dependency source and build provenance
        env:
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/dependency-sources.py dist
      - name: Upload packages to draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        run: python scripts/upload-release.py dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: screenshots-${{ matrix.platform }}
          path: build/screenshots/
          if-no-files-found: error
  linux-compatibility:
    needs: [stage, package]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stage.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install runtime test tools (no Qt SDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth imagemagick libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libgl1 libegl1 libopengl0 zsync
      - name: Download exact draft packages and test
        run: |
          gh release download "v$VERSION" --pattern '*AppImage' --pattern '*AppImage.zsync' --pattern '*linux-x86_64.tar.gz' --dir candidates
          chmod +x candidates/*.AppImage
          python3 scripts/check-appimage-update.py candidates/*.AppImage
          xvfb-run -a python3 scripts/check-linux-package.py candidates
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-compatibility-${{ matrix.os }}
          path: build/linux-evidence/
  catalog:
    needs: [stage, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stage.outputs.version }}
      DISPLAY: ':99'
      IS_PULLREQUEST: 'true'
      STRICT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download exact candidate
        run: |
          gh release download "v$VERSION" --pattern '*AppImage' --dir candidates
          sha256sum candidates/* > candidate-sha256.txt
      - name: Check out pinned upstream catalog worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AppImage/appimage.github.io
          ref: f1249e9e1ff840dd53a6218aec3451ebd6bf476d
          path: catalog
      - name: Install upstream worker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sudo imagemagick libasound2-dev pulseaudio-utils alsa-utils alsa-oss libjack0 desktop-file-utils xmlstarlet xsel xterm xvfb icewm x11-utils x11-apps netpbm xdotool libgl1-mesa-dri libgl1-mesa-dev mesa-utils libosmesa6 libsdl1.2-dev libsdl2-2.0-0 fonts-wqy-microhei libfile-mimeinfo-perl tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-ara tesseract-ocr-rus tesseract-ocr-ell libfuse2 stalonetray
          cd catalog
          bash code/fetch-deps.sh
          cp -a deps/. .
          sudo bash code/prep-dummy-soundcard.sh
          sudo gem install dupervisor -v 1.0.5
          sudo npm install -g asar
      - name: Run unmodified catalog worker against candidate bytes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory candidates > server.log 2>&1 &
          Xvfb :99 -screen 0 800x600x24 > xvfb.log 2>&1 &
          mkdir -p "$HOME/.icewm"
          echo 'ShowTaskBar = 0' > "$HOME/.icewm/preferences"
          sleep 2
          cd catalog
          echo "http://127.0.0.1:8765/TodoBench-$VERSION-x86_64.AppImage" > data/TodoBench
          timeout --kill-after=30 600 bash -e code/worker.sh "$PWD/data/TodoBench" 2>&1 | tee ../catalog.log
          cmp BeingTested.AppImage "../candidates/TodoBench-$VERSION-x86_64.AppImage"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appimage-catalog-evidence
          path: |
            catalog.log
            candidate-sha256.txt
            catalog/database/TodoBench/
            catalog/failure-screens/
            server.log
            xvfb.log
  verify-and-publish:
    needs: [stage, checks, package, linux-compatibility, catalog]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stage.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download and verify all staged artifacts
        run: |
          gh release download "v$VERSION" --dir release-assets
          python3 scripts/verify-release.py release-assets "$VERSION" "$GITHUB_SHA"
          python3 scripts/finalize-release.py release-assets "$VERSION"
      - name: Publish verified draft
        if: inputs.publish
        run: gh release edit "v$VERSION" --draft=false --latest
      - name: Refresh website downloads after publication
        if: inputs.publish
        run: gh workflow run pages.yml --ref main
