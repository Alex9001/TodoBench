name: Verify staged release
on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Completed Release run with successful native CI and all package jobs
        type: string
        required: true
      publish:
        description: Publish after candidate revalidation passes
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.build.outputs.version }}
      commit: ${{ steps.build.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: python3 scripts/check-release-build.py "$BUILD_RUN"
  linux-compatibility:
    needs: stage
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stage.outputs.version }}
      SOURCE_COMMIT: ${{ needs.stage.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install runtime test tools (no Qt SDK)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth imagemagick libfuse2 libxcb-cursor0 libxkbcommon-x11-0 libgl1 libegl1 libopengl0 zsync
      - name: Download exact draft packages and test
        run: |
          gh release download "v$VERSION" --pattern '*AppImage' --pattern '*AppImage.zsync' --pattern '*linux-x86_64.tar.gz' --dir candidates
          chmod +x candidates/*.AppImage
          python3 scripts/check-appimage-update.py candidates/*.AppImage
          xvfb-run -a python3 scripts/check-linux-package.py candidates
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-compatibility-${{ matrix.os }}
          path: build/linux-evidence/
  catalog:
    needs: stage
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stage.outputs.version }}
      SOURCE_COMMIT: ${{ needs.stage.outputs.commit }}
      DISPLAY: ':99'
      IS_PULLREQUEST: 'true'
      STRICT: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download exact candidate
        run: |
          gh release download "v$VERSION" --pattern '*AppImage' --dir candidates
          sha256sum candidates/* > candidate-sha256.txt
      - name: Check out pinned upstream catalog worker
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: AppImage/appimage.github.io
          ref: f1249e9e1ff840dd53a6218aec3451ebd6bf476d
          path: catalog
      - name: Install upstream worker dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sudo imagemagick libasound2-dev pulseaudio-utils alsa-utils alsa-oss libjack0 desktop-file-utils xmlstarlet xsel xterm xvfb icewm x11-utils x11-apps netpbm xdotool libgl1-mesa-dri libgl1-mesa-dev mesa-utils libosmesa6 libsdl1.2-dev libsdl2-2.0-0 fonts-wqy-microhei libfile-mimeinfo-perl tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-ara tesseract-ocr-rus tesseract-ocr-ell libfuse2 stalonetray
          cd catalog
          bash code/fetch-deps.sh
          cp -a deps/. .
          sudo bash code/prep-dummy-soundcard.sh
          sudo gem install dupervisor -v 1.0.5
          sudo npm install -g asar
      - name: Run unmodified catalog worker against candidate bytes
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory candidates > server.log 2>&1 &
          Xvfb :99 -screen 0 800x600x24 > xvfb.log 2>&1 &
          mkdir -p "$HOME/.icewm"
          echo 'ShowTaskBar = 0' > "$HOME/.icewm/preferences"
          sleep 2
          cd catalog
          echo "http://127.0.0.1:8765/TodoBench-$VERSION-x86_64.AppImage" > data/TodoBench
          timeout --kill-after=30 600 bash -e code/worker.sh "$PWD/data/TodoBench" 2>&1 | tee ../catalog.log
          cmp BeingTested.AppImage "../candidates/TodoBench-$VERSION-x86_64.AppImage"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: appimage-catalog-evidence
          path: |
            catalog.log
            candidate-sha256.txt
            catalog/database/TodoBench/
            catalog/failure-screens/
            server.log
            xvfb.log
  verify-and-publish:
    needs: [stage, linux-compatibility, catalog]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.stage.outputs.version }}
      SOURCE_COMMIT: ${{ needs.stage.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Download and verify all staged artifacts
        run: |
          gh release download "v$VERSION" --dir release-assets
          python3 scripts/verify-release.py release-assets "$VERSION" "$SOURCE_COMMIT"
          python3 scripts/finalize-release.py release-assets "$VERSION"
      - name: Publish verified draft
        if: inputs.publish
        run: gh release edit "v$VERSION" --draft=false --latest
      - name: Refresh website downloads after publication
        if: inputs.publish
        run: gh workflow run pages.yml --ref main
